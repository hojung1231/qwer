name: Build 화음왕 Android APK
on:
  push:
    branches: [main, ccr-bfdf6d41-ijaztk]
    paths: ['hwaeumwang/**', '.github/workflows/hwaeumwang-android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hwaeumwang-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: hwaeumwang/android
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare APK
        run: cp hwaeumwang/android/app/build/outputs/apk/debug/app-debug.apk hwaeumwang.apk
      - uses: actions/upload-artifact@v4
        with:
          name: hwaeumwang-apk
          path: hwaeumwang.apk
          retention-days: 30
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hwaeumwang-preview >/dev/null 2>&1 || gh release create hwaeumwang-preview --prerelease --title "화음왕 미리보기" --notes "화음왕 안드로이드 미리보기 빌드. 푸시할 때마다 최신 APK로 교체됩니다." --target "$GITHUB_SHA"
          gh release upload hwaeumwang-preview hwaeumwang.apk --clobber
