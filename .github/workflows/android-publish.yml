name: Publish existing Android APK
# Reuses the completed native build; no recompilation is needed.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reuse completed Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42005623952 --name bogo-again-android-apk --dir apk
          cp apk/bogo-again-android.apk bogo-again-android.apk
          node -e "require('fs').writeFileSync('recovered-config.json',JSON.stringify({version:'1.5.1',android:{versionCode:14,package:'com.hojung1231.bogoagain'}}))"
          node native/scripts/create-update-manifest.cjs bogo-again-android.apk recovered-config.json android-update.json
          gh release download android-preview --pattern android-update.json --dir current
          node -e "const fs=require('fs');if(JSON.parse(fs.readFileSync('current/android-update.json')).versionCode>JSON.parse(fs.readFileSync('android-update.json')).versionCode)throw Error('Refusing to replace a newer Android release')"
          gh release upload android-preview bogo-again-android.apk android-update.json --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: bogo-again-android-apk
          path: bogo-again-android.apk
          retention-days: 30
