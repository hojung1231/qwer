<title>화음왕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
/* Layout: dark-first music app — big screen title, borderless song rows with colour artwork, floating add button and a floating glass tab bar. */
:root{
  color-scheme:dark;
  --bg:#0c0c10; --raise:#17171d; --ink:#f5f5f7; --muted:#8e8e99; --hair:#24242c;
  --brand:#ffb627; --on-brand:#1a1300; --glass:rgba(28,28,36,.72); --danger:#ff6b5e; --press:rgba(255,255,255,.06); --ok:#3ddc97; --ok-bg:rgba(61,220,151,.14);
  --font:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f7f7f9; --raise:#ffffff; --ink:#111114; --muted:#73737e; --hair:#e6e6ec;
  --brand:#f0a000; --on-brand:#1a1300; --glass:rgba(255,255,255,.78); --danger:#d43b2f; --press:rgba(0,0,0,.05); --ok:#0b8f5f; --ok-bg:rgba(11,143,95,.12)}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f7f9; --raise:#ffffff; --ink:#111114; --muted:#73737e; --hair:#e6e6ec;
  --brand:#f0a000; --on-brand:#1a1300; --glass:rgba(255,255,255,.78); --danger:#d43b2f; --press:rgba(0,0,0,.05); --ok:#0b8f5f; --ok-bg:rgba(11,143,95,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--font);letter-spacing:-.01em;overflow:hidden}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:12px}

main{height:100%;overflow-y:auto;padding-block:14px 190px}
.brand{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.wordmark{display:flex;align-items:center;gap:7px;font-weight:900;font-size:1.02rem;letter-spacing:-.02em}
.wordmark svg{width:20px;height:20px}
.text-btn{color:var(--brand);font-weight:700;padding:8px 2px}
h1{font-size:2.15rem;font-weight:900;letter-spacing:-.045em;line-height:1.1;margin:22px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px;font-variant-numeric:tabular-nums}

.songs{list-style:none;margin:0 -8px;padding:0}
.song{display:flex;align-items:center;gap:14px;padding:9px 8px;border-radius:16px;min-height:74px}
.song:active{background:var(--press)}
.art{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.35rem;
  box-shadow:0 6px 16px -8px var(--shade,#000)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:700;font-size:1.02rem;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur{flex:none;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.chip{flex:none;font-size:.68rem;font-weight:700;color:var(--muted);background:var(--raise);border:1px solid var(--hair);border-radius:999px;padding:2px 8px}
.ext{flex:none;height:36px;padding:0 14px;white-space:nowrap;border-radius:999px;border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:.86rem}
.ext:active{background:var(--press)}
.done{flex:none;display:flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 9px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:.8rem;white-space:nowrap}
.done svg{width:15px;height:15px}
.pct{flex:none;min-width:3.2em;text-align:right;color:var(--brand);font-weight:900;font-size:1.15rem;font-variant-numeric:tabular-nums}
.stage{margin-top:7px}
.stage i{display:block;height:5px;border-radius:3px;background:var(--hair);overflow:hidden}
.stage i::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--brand);border-radius:3px}
.meta .detail{color:var(--ok);font-size:.78rem;font-variant-numeric:tabular-nums}
.del{flex:none;width:30px;height:30px;border-radius:50%;background:var(--danger);display:grid;place-items:center}
.del::before{content:"";width:12px;height:2.5px;border-radius:2px;background:#fff}
.note{color:var(--muted);font-size:.84rem;line-height:1.6;margin:18px 0 0;padding:14px 16px;background:var(--raise);border-radius:16px}
.note:empty{display:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:64px 12px 0;color:var(--muted);font-size:.9rem;line-height:1.6}
.empty svg{width:52px;height:52px;color:var(--hair);margin-bottom:6px}
.empty b{color:var(--ink);font-size:1.1rem;font-weight:700}
.note.err{color:var(--danger)}
.ed-title{font-size:1.7rem;font-weight:900;letter-spacing:-.04em;line-height:1.15;margin:16px 0 4px}
.label{font-size:.82rem;font-weight:700;color:var(--muted);margin:22px 0 9px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--raise)}
.seg button{padding:10px 4px;border-radius:10px;font-weight:700;font-size:.9rem;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--brand);color:var(--on-brand);font-weight:900}
.seg-desc{color:var(--muted);font-size:.84rem;margin:9px 2px 0;min-height:1.5em}
#edStyle + .sub{margin:0 0 2px}
.cols,.row{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px}
.cols{position:sticky;top:-14px;z-index:2;background:var(--bg);padding:12px 0 10px;margin-top:8px}
.cols span{font-weight:900;font-size:.95rem;text-align:center;padding:9px 0;border-radius:12px;background:var(--raise)}
.cols span b{display:inline-block;margin-left:6px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.cols span.c0{color:var(--brand)}
.rows{display:flex;flex-direction:column;gap:10px}
.slot{border:1.5px dashed var(--hair);border-radius:16px;min-height:64px}
.bundle{display:block;width:100%;text-align:left;border-radius:16px;padding:12px 13px;box-sizing:border-box;background:var(--raise);border:1.5px solid var(--hair);
  font-size:.84rem;line-height:1.6;font-weight:500;min-height:64px;overflow-wrap:anywhere}
.bundle.c0{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--raise))}
.bundle small{display:block;color:var(--muted);font-size:.72rem;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bundle.c0 small{color:var(--brand)}
.bundle span{display:block}
.bundle{cursor:pointer}
.bundle::after{content:"";display:block;clear:both}
.bundle:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.play{float:right;margin:-3px -4px 4px 8px;width:32px;height:32px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.play::before{content:"";border-style:solid;border-width:6px 0 6px 10px;border-color:transparent transparent transparent var(--bg);margin-left:3px}
.play.on{background:var(--brand)}
.play.on::before{border:0;width:10px;height:10px;border-radius:2px;background:var(--on-brand);margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(164px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--ink);color:var(--bg);
  font-weight:700;font-size:.86rem;padding:10px 16px;border-radius:999px;white-space:nowrap;max-width:calc(100% - 40px);overflow:hidden;text-overflow:ellipsis}
.song.open{cursor:pointer}
.soon{display:grid;place-items:center;min-height:55vh;color:var(--muted);text-align:center}

.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--brand);color:var(--on-brand);
  font-weight:900;box-shadow:0 12px 28px -10px var(--brand)}
.fab svg{width:20px;height:20px}
.fab:active{transform:scale(.97)}
.fab{cursor:pointer;user-select:none;-webkit-user-select:none}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr-file{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  width:min(360px,calc(100% - 2*max(20px,env(safe-area-inset-left,0px))));display:flex;padding:6px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid var(--hair);box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:999px;color:var(--muted);font-size:.68rem;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--press)}
.tab[aria-selected="true"] svg{color:var(--brand)}
.tab:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:no-preference){.bundle{animation:pop .18s ease}.song{transition:background .15s}.fab{transition:transform .12s}}
@keyframes pop{from{transform:scale(.94);opacity:.4}}
</style>

<main class="gutter" id="main">
  <div class="brand">
    <div class="wordmark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5h18l1.2-10.2-5.5 4.3L12 4.5 7.3 11.6 1.8 7.3z" fill="var(--brand)"/><rect x="3" y="18.8" width="18" height="2.4" rx="1.2" fill="var(--brand)"/></svg>
      화음왕
    </div>
    <button class="text-btn" id="editBtn" type="button" aria-pressed="false" hidden>편집</button>
  </div>

  <section id="screen-library">
    <h1>내 음악창고</h1>
    <p class="sub" id="count">아직 넣은 곡이 없습니다</p>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.2v10.1a3.2 3.2 0 1 0 1.8 2.9V8.3l7-1.6v6a3.2 3.2 0 1 0 1.8 2.9V3.4a.9.9 0 0 0-1.1-.9l-8.8 2a.9.9 0 0 0-.7.9z"/></svg>
      <b>창고가 비어 있어요</b>
      <span>아래 ‘곡 추가’를 눌러 휴대폰에 있는 mp3 파일을 고르세요.<br>파일은 이 기기 안에만 저장됩니다.</span>
    </div>
    <ul class="songs" id="songs"></ul>
    <p class="note" id="note"></p>
  </section>
  <section id="screen-edit" hidden>
    <div class="empty" id="edEmpty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="6" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="6" rx="1.8"/></svg>
      <b>편집할 곡을 골라 주세요</b>
      <span>‘내 음악창고’에서 화음 추출이 끝난 곡을 누르면<br>여기서 화음으로 연습할 소절을 고를 수 있어요.</span>
    </div>
    <h1 class="ed-title" id="edTitle"></h1>
    <div id="edStyle">
      <h2 class="label">화음 구성</h2>
      <div class="seg" id="seg" role="radiogroup" aria-label="화음 구성"></div>
      <p class="seg-desc" id="segDesc"></p>
      <h2 class="label">연습할 소절</h2>
    </div>
    <p class="sub" id="edSub"></p>
    <div class="cols" id="edCols"></div>
    <div class="rows" id="edRows"></div>
    <p class="note" id="edNote"></p>
  </section>
  <section id="screen-soon" class="soon" hidden><p>이 탭은 아직 만들지 않았습니다.</p></section>
</main>

<!-- The button is a label for the file input itself: tapping it opens the phone's file picker directly,
     which works in browsers and in-app views that ignore a scripted click on a hidden input. -->
<label class="fab" id="addBtn" for="picker" role="button" tabindex="0">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  곡 추가
</label>
<input id="picker" class="sr-file" type="file" accept=".mp3,audio/mpeg,audio/mp3" multiple tabindex="-1" aria-hidden="true">

<div class="toast" id="toast" role="status" hidden></div>

<nav class="tabs" role="tablist" aria-label="화면 전환">
  <button class="tab" role="tab" aria-selected="true" data-screen="library" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.2v10.1a3.2 3.2 0 1 0 1.8 2.9V8.3l7-1.6v6a3.2 3.2 0 1 0 1.8 2.9V3.4a.9.9 0 0 0-1.1-.9l-8.8 2a.9.9 0 0 0-.7.9z"/></svg>
    내 음악창고
  </button>
  <button class="tab" role="tab" aria-selected="false" data-screen="edit" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="7" height="6" rx="1.8"/><rect x="13.5" y="13.5" width="7" height="6" rx="1.8"/><path d="M13.5 7.5h7M3.5 16.5h7" stroke-dasharray="1.5 2.6"/></svg>
    소절 편집
  </button>
  <button class="tab" role="tab" aria-selected="false" disabled type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2.5 3.4"/></svg>
    준비 중
  </button>
</nav>

<script>
"use strict";
const $=id=>document.getElementById(id);
let songs=[], editing=false;
// One example card, so the extract button can be tried before any file is added.
// Its result is what our pipeline really produced for this song.
const EXAMPLE={id:"ex-sungnyeoege",title:"숙녀에게",artist:"변진섭",album:"희망사항",dur:226,added:0,example:true,
  result:{notes:258,key:"D장조",bpm:72,sig:"12/8"},
  // only the opening words of each bundle: the example has no file to read the lyrics from
  bundles:[["어쩌면…"],["그대의…"],["허면…"],["나 그…"],["나 그…"]].map((l,i)=>({from:i*4+1,to:i*4+4,lines:l.concat("(예시 곡은 첫머리만 표시합니다)")}))};
try{ const p=JSON.parse(pref("ex_parts")||"null"); if(Array.isArray(p)) EXAMPLE.parts=p }catch(e){}
EXAMPLE.style=pref("ex_style")||"up";
const pref=(k,v)=>{ try{ if(v===undefined) return localStorage.getItem("hw_"+k); localStorage.setItem("hw_"+k,v) }catch(e){} return null };
EXAMPLE.state=pref("ex")==="done"?"done":undefined;
let exampleHidden=pref("ex")==="hidden";
// No server is connected to this prototype yet, so extraction only counts up to 100%.
// The estimate follows the song's length; the real job takes about a minute for a four-minute song.
function extract(s,li){
  if(s.state) return; s.state="busy";
  const total=Math.max(8,Math.min(20,(s.dur||200)*0.05))*1000, t0=performance.now();
  const meta=li.querySelector(".meta"), btn=li.querySelector(".ext");
  const pct=document.createElement("span"); pct.className="pct"; pct.setAttribute("role","status"); btn.replaceWith(pct);
  const st=document.createElement("div"); st.className="stage"; const bar=document.createElement("i"); st.append(bar);
  meta.append(st);
  const tick=()=>{
    const p=Math.min(1,(performance.now()-t0)/total);
    if(p>=1){ s.state="done"; if(s.example) pref("ex","done"); else dbPut(s); render(); return }
    bar.style.setProperty("--p",(p*100).toFixed(1)+"%"); pct.textContent=Math.floor(p*100)+"%";
    requestAnimationFrame(tick);
  };
  tick();
}

// ---------------------------------------------------------------- storage (this device only)
const DB=new Promise(res=>{ try{ const r=indexedDB.open("hwaeumwang",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("songs",{keyPath:"id"});
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null) }catch(e){res(null)} });
async function dbAll(){ const db=await DB; if(!db) return [];
  return new Promise(res=>{ try{ const q=db.transaction("songs").objectStore("songs").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]) }catch(e){res([])} }) }
async function dbPut(s){ const db=await DB; if(!db) return false;
  return new Promise(res=>{ try{ const tx=db.transaction("songs","readwrite"); tx.objectStore("songs").put(s); tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false) }catch(e){res(false)} }) }
async function dbDel(id){ const db=await DB; if(db) try{ db.transaction("songs","readwrite").objectStore("songs").delete(id) }catch(e){} }

// ---------------------------------------------------------------- reading a music file
function decodeText(bytes,enc){
  if(enc===1){ if(bytes[0]===0xfe&&bytes[1]===0xff) return new TextDecoder("utf-16be").decode(bytes.subarray(2));
    return new TextDecoder("utf-16le").decode(bytes[0]===0xff&&bytes[1]===0xfe?bytes.subarray(2):bytes) }
  if(enc===2) return new TextDecoder("utf-16be").decode(bytes);
  if(enc===3) return new TextDecoder("utf-8").decode(bytes);
  try{ return new TextDecoder("euc-kr",{fatal:true}).decode(bytes) }catch(e){ return new TextDecoder("latin1").decode(bytes) }
}
async function readTags(file){                       // ID3v2 title / artist / album (mp3); other formats fall back to the file name
  const out={};
  try{
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33) return out;
    const ver=head[3], size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
    const b=new Uint8Array(await file.slice(10,10+Math.min(size,1500000)).arrayBuffer()); let p=0;
    const idLen=ver===2?3:4, hdr=ver===2?6:10, want={TIT2:"title",TT2:"title",TPE1:"artist",TP1:"artist",TALB:"album",TAL:"album"};
    while(p+hdr<=b.length&&b[p]!==0){
      const id=String.fromCharCode(...b.subarray(p,p+idLen)); let len;
      if(ver===2) len=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];
      else if(ver===4) len=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];
      else len=((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;
      if(len<=0) break;
      if((id==="USLT"||id==="ULT")&&p+hdr+len<=b.length){ const body=b.subarray(p+hdr,p+hdr+len), enc=body[0]; let q=4;   // enc, lang(3), descriptor\0, text
        if(enc===1||enc===2){ while(q+1<body.length&&!(body[q]===0&&body[q+1]===0)) q+=2; q+=2 } else { while(q<body.length&&body[q]!==0) q++; q++ }
        out.lyrics=decodeText(body.subarray(q),enc).replace(/\0+$/,"") }
      if(want[id]&&p+hdr+len<=b.length){ const body=b.subarray(p+hdr,p+hdr+len); out[want[id]]=decodeText(body.subarray(1),body[0]).replace(/\0+$/,"").trim() }
      p+=hdr+len;
    }
  }catch(e){}
  return out;
}
function readDuration(file){
  return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; try{URL.revokeObjectURL(a.src)}catch(e){} res(v) } };
    const a=new Audio(); a.preload="metadata"; a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0); a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),4000); try{ a.src=URL.createObjectURL(file) }catch(e){ fin(0) } });
}
async function addFiles(files){
  const note=$("note"); note.className="note"; let added=0, skipped=0, unsaved=0, wrong=0;
  for(const f of files){
    if(songs.some(s=>s.name===f.name&&s.size===f.size)){ skipped++; continue }
    note.textContent=`읽는 중: ${f.name}`;
    if(!/\.mp3$/i.test(f.name)&&!/mpeg|mp3/i.test(f.type||"")){ wrong++; continue }
    const [tag,dur]=await Promise.all([readTags(f),readDuration(f)]);
    const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name,size:f.size,added:Date.now(),
      title:tag.title||f.name.replace(/\.[^.]+$/,""),artist:tag.artist||"",album:tag.album||"",dur,lyrics:tag.lyrics||"",blob:f};
    songs.push(s); added++; render();
    if(!(await dbPut(s))) unsaved++;
  }
  const parts=[]; if(skipped) parts.push(`이미 있는 ${skipped}곡은 건너뛰었습니다.`);
  if(wrong) parts.push(`mp3가 아닌 파일 ${wrong}개는 넣지 않았습니다.`);
  if(unsaved){ parts.push(`${unsaved}곡은 이 기기에 저장하지 못해 페이지를 닫으면 사라집니다.`); note.className="note err" }
  note.textContent=parts.join(" ");
}

// ---------------------------------------------------------------- rendering
const fmt=t=>t>0?Math.floor(t/60)+":"+String(Math.round(t%60)).padStart(2,"0"):"–";
function artwork(title){                               // a stable colour pair per song, standing in for album art
  let h=7; for(const ch of title) h=(h*31+ch.codePointAt(0))%360;
  return {bg:`linear-gradient(140deg,hsl(${h} 78% 58%),hsl(${(h+48)%360} 72% 40%))`,shade:`hsl(${(h+48)%360} 72% 30%)`};
}
function render(){
  const list=(exampleHidden?[]:[EXAMPLE]).concat(songs.slice().sort((a,b)=>a.added-b.added)), ul=$("songs"); ul.textContent="";
  $("empty").hidden=list.length>0;
  for(const s of list){
    const li=document.createElement("li"); li.className="song"+(s.state==="done"?" open":"");
    li.onclick=e=>{ if(editing||e.target.closest("button")) return;
      if(s.state==="done") openEditor(s); else if(s.state!=="busy") toast("먼저 ‘화음 추출’을 눌러 주세요") };
    const art=document.createElement("div"); art.className="art"; art.textContent=(s.title||"?").trim().charAt(0); art.setAttribute("aria-hidden","true");
    const c=artwork(s.title||"?"); art.style.background=c.bg; art.style.setProperty("--shade",c.shade);
    const meta=document.createElement("div"); meta.className="meta";
    const b=document.createElement("b"); b.textContent=s.title;
    const sp=document.createElement("span"); sp.textContent=[s.artist||"가수 정보 없음",fmt(s.dur)].join(" · ")+(s.example?" · 예시":"");
    meta.append(b,sp); li.append(art,meta);
    if(s.state==="busy") s.state=undefined;                       // a run interrupted by a reload starts over
    if(s.state==="done"&&s.result){ const d=document.createElement("span"); d.className="detail";
      d.textContent=`멜로디 ${s.result.notes}음 · ${s.result.key} · ${s.result.bpm}BPM · ${s.result.sig}`; meta.append(d) }
    if(editing){ const x=document.createElement("button"); x.className="del"; x.type="button"; x.setAttribute("aria-label",s.title+" 삭제");
      x.onclick=async()=>{ if(s.example){ exampleHidden=true; pref("ex","hidden") } else { songs=songs.filter(o=>o!==s); await dbDel(s.id) }
        if(current===s){ current=null; closePlayer() }
        if(!songs.length&&exampleHidden) setEditing(false); render() }; li.append(x) }
    else if(s.state==="done"){ const d=document.createElement("span"); d.className="done";
      d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
      d.append("추출 완료"); d.setAttribute("aria-label","화음 추출 완료"); li.append(d) }
    else { const x=document.createElement("button"); x.className="ext"; x.type="button"; x.textContent="화음 추출"; x.setAttribute("aria-label",s.title+" 화음 추출");
      x.onclick=()=>extract(s,li); li.append(x) }
    ul.append(li);
  }
  const total=list.reduce((a,s)=>a+(s.dur||0),0), nDone=list.filter(s=>s.state==="done").length;
  $("count").textContent=list.length?`${list.length}곡 · ${Math.floor(total/60)}분 · 추출 ${nDone}곡`:"아직 넣은 곡이 없습니다";
  $("editBtn").hidden=!list.length;
}
function setEditing(v){ editing=v; $("editBtn").setAttribute("aria-pressed",v); $("editBtn").textContent=v?"완료":"편집" }

// ---------------------------------------------------------------- practice editor
// Which parts of the song to practise harmony on.  The lyrics are cut into bundles of four lines,
// one bundle per row; a bundle sits in the column it is assigned to and a tap moves it to the next.
const COLS=["화음","솔로"], PER_BUNDLE=4;
// How the harmony line is written for the whole song (the three versions our generator makes).
const STYLES=[["up","3도 위","멜로디보다 3도 높게 따라갑니다. 밝고 또렷한, 가장 흔한 화음입니다."],
  ["down","3도 아래","멜로디보다 3도 낮게 받쳐 줍니다. 따뜻하고 부르기 편한 화음입니다."],
  ["arranged","편곡","소절마다 위·아래와 음정을 골라, 음을 붙잡거나 반대로 움직이는 화음입니다."]];
function renderStyle(){
  const s=current, seg=$("seg"); seg.textContent=""; if(!STYLES.some(x=>x[0]===s.style)) s.style="up";
  for(const [id,name,desc] of STYLES){ const b=document.createElement("button"); b.type="button"; b.textContent=name; b.setAttribute("role","radio"); b.setAttribute("aria-checked",s.style===id);
    b.onclick=()=>{ s.style=id; if(s.example) pref("ex_style",id); else dbPut(s); renderStyle() }; seg.append(b); if(s.style===id) $("segDesc").textContent=desc }
}
// Where each bundle is sung, in seconds.  Finding this needs the real extraction, which has no
// server yet; for the three songs already analysed the measured ranges are built in, matched by title.
const TIMES={"사랑했지만":[[16.2,39.4],[40.9,64.4],[65.5,87.1],[86.3,110.9],[110.9,129.0],[129.4,178.6],[178.6,203.3],[202.5,219.4],[218.6,246.8]],"숙녀에게":[[30.6,59.7],[58.9,84.6],[83.8,144.7],[143.9,171.3],[170.5,202.4]],"청혼":[[23.9,48.4],[47.6,71.4],[71.6,93.6],[93.6,123.6],[122.8,139.8],[139.0,165.4],[164.6,184.0],[183.2,188.2]]};
const player=new Audio(); let playing=-1, playUrl=null, stopAt=0;
player.ontimeupdate=()=>{ if(playing>=0&&player.currentTime>=stopAt) stopPlay() };
player.onended=()=>stopPlay();
function stopPlay(){ if(playing<0) return; player.pause(); playing=-1; for(const b of document.querySelectorAll(".play")) b.classList.remove("on") }
function playBundle(s,b,i,btn){
  if(playing===i){ stopPlay(); return }
  if(!s.blob){ toast("예시 곡은 파일이 없어 들을 수 없어요. 같은 곡 mp3를 추가해 보세요"); return }
  if(!b.t){ toast("이 곡은 아직 소절 위치를 모릅니다 (실제 추출 연결 후 가능)"); return }
  stopPlay();
  if(!playUrl){ try{ playUrl=URL.createObjectURL(s.blob); player.src=playUrl }catch(e){ toast("이 파일을 재생할 수 없습니다"); return } }
  stopAt=b.t[1]; playing=i; btn.classList.add("on");
  const go=()=>{ try{ player.currentTime=b.t[0] }catch(e){} player.play().catch(()=>{ stopPlay(); toast("재생을 시작하지 못했습니다") }) };
  if(player.readyState>=1) go(); else player.addEventListener("loadedmetadata",go,{once:true});
}
const mmss=t=>Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0");
let current=null;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true },2200) }
async function bundlesOf(s){
  const times=TIMES[(s.title||"").trim()]||[];
  if(s.example) return s.bundles.map((b,i)=>({...b,t:times[i]||null}));
  if(s.lyrics===undefined&&s.blob){ s.lyrics=(await readTags(s.blob)).lyrics||""; dbPut(s) }   // songs added before lyrics were read
  const lines=(s.lyrics||"").replace(/\r/g,"").split("\n").map(l=>l.trim()).filter(Boolean), out=[];
  for(let i=0;i<lines.length;i+=PER_BUNDLE) out.push({from:i+1,to:Math.min(lines.length,i+PER_BUNDLE),lines:lines.slice(i,i+PER_BUNDLE),t:times[i/PER_BUNDLE]||null});
  return out;
}
function saveParts(s){ if(s.example) pref("ex_parts",JSON.stringify(s.parts)); else dbPut(s) }
async function openEditor(s){
  if(current!==s) closePlayer();
  current=s; pref("last",s.id); const bs=await bundlesOf(s);
  if(!Array.isArray(s.parts)||s.parts.length!==bs.length) s.parts=bs.map(()=>0);          // everything starts under 화음
  $("edTitle").textContent=s.title;
  $("edNote").textContent=bs.length?"":"이 mp3 안에 가사가 없어서 묶음을 만들 수 없습니다.";
  show("edit"); renderStyle(); renderEditor(bs);
}
function renderEditor(bs){
  const s=current, cols=$("edCols"), rows=$("edRows"); cols.style.setProperty("--n",COLS.length); cols.textContent=""; rows.textContent="";
  COLS.forEach((name,c)=>{ const h=document.createElement("span"); h.className="c"+c; h.textContent=name;
    const n=document.createElement("b"); n.textContent=s.parts.filter(p=>p===c).length; h.append(n); cols.append(h) });
  bs.forEach((b,i)=>{ const row=document.createElement("div"); row.className="row"; row.style.setProperty("--n",COLS.length);
    COLS.forEach((name,c)=>{
      if(s.parts[i]!==c){ const e=document.createElement("div"); e.className="slot"; row.append(e); return }
      // the bundle is the tap target for moving; the play button inside it must not move it
      const btn=document.createElement("div"); btn.className="bundle c"+c; btn.setAttribute("role","button"); btn.tabIndex=0;
      const next=COLS[(c+1)%COLS.length]; btn.setAttribute("aria-label",`${b.from}~${b.to}번째 줄, 지금 ${name}. 누르면 ${next}(으)로 옮깁니다`);
      const pl=document.createElement("button"); pl.type="button"; pl.className="play"+(playing===i?" on":""); pl.setAttribute("aria-label",`${b.from}~${b.to}번째 줄 원곡 듣기`);
      pl.onclick=e=>{ e.stopPropagation(); playBundle(s,b,i,pl) }; btn.append(pl);
      const sm=document.createElement("small"); sm.textContent=(b.from===b.to?`${b.from}번째 줄`:`${b.from}~${b.to}번째 줄`)+(b.t?` · ${mmss(b.t[0])}`:""); btn.append(sm);
      for(const l of b.lines){ const sp=document.createElement("span"); sp.textContent=l; btn.append(sp) }
      const move=()=>{ s.parts[i]=(c+1)%COLS.length; saveParts(s); renderEditor(bs) };
      btn.onclick=move; btn.onkeydown=e=>{ if((e.key==="Enter"||e.key===" ")&&e.target===btn){ e.preventDefault(); move() } };
      row.append(btn) });
    rows.append(row) });
  $("edSub").textContent=bs.length?`묶음을 누르면 ${COLS.join(" ↔ ")}로 옮겨집니다.`:"";
}
function closePlayer(){ stopPlay(); if(playUrl){ try{URL.revokeObjectURL(playUrl)}catch(e){} playUrl=null; player.removeAttribute("src") } }
function show(name){
  if(name!=="edit") stopPlay();
  $("screen-library").hidden=name!=="library"; $("screen-edit").hidden=name!=="edit"; $("screen-soon").hidden=name!=="soon";
  $("addBtn").hidden=name!=="library"; $("picker").disabled=name!=="library";
  $("editBtn").hidden=name!=="library"||!(songs.length||!exampleHidden);
  for(const o of document.querySelectorAll(".tab")) o.setAttribute("aria-selected",o.dataset.screen===name);
  if(name==="edit"){ const has=!!current; $("edEmpty").hidden=has; for(const id of ["edTitle","edStyle","edSub","edCols","edRows","edNote"]) $(id).hidden=!has }
  if(name==="library") render();
  $("main").scrollTop=0;
}
// the second tab reopens the song edited last, if it is still there and extracted
function openEditTab(){
  const all=(exampleHidden?[]:[EXAMPLE]).concat(songs), s=current&&all.includes(current)?current:all.find(o=>o.id===pref("last")&&o.state==="done");
  if(s&&s.state==="done") openEditor(s); else { current=null; closePlayer(); show("edit") }
}

// ---------------------------------------------------------------- wiring
$("addBtn").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("picker").click() } };
$("picker").onchange=async e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length){ $("note").textContent=""; await addFiles(fs) } };
$("editBtn").onclick=()=>{ setEditing(!editing); render() };
for(const t of document.querySelectorAll(".tab")) t.onclick=()=>{
  if(t.disabled) return;
  if(t.dataset.screen==="edit") openEditTab(); else show(t.dataset.screen==="library"?"library":"soon");
};
render();
dbAll().then(rows=>{ if(rows.length){ songs=rows; $("note").textContent=""; render() } });
</script>
