<title>화음왕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&display=swap">
<style>
/* Layout: dark-first music app — big screen title, borderless song rows with colour artwork, floating add button and a floating glass tab bar. */
:root{
  color-scheme:dark;
  --bg:#0c0c10; --raise:#17171d; --ink:#f5f5f7; --muted:#8e8e99; --hair:#24242c;
  --brand:#ffb627; --on-brand:#1a1300; --glass:rgba(28,28,36,.72); --danger:#ff6b5e; --press:rgba(255,255,255,.06);
  --font:"Gothic A1",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f7f7f9; --raise:#ffffff; --ink:#111114; --muted:#73737e; --hair:#e6e6ec;
  --brand:#f0a000; --on-brand:#1a1300; --glass:rgba(255,255,255,.78); --danger:#d43b2f; --press:rgba(0,0,0,.05)}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f7f9; --raise:#ffffff; --ink:#111114; --muted:#73737e; --hair:#e6e6ec;
  --brand:#f0a000; --on-brand:#1a1300; --glass:rgba(255,255,255,.78); --danger:#d43b2f; --press:rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.45 var(--font);letter-spacing:-.01em;overflow:hidden}
.gutter{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:12px}

main{height:100%;overflow-y:auto;padding-block:14px 190px}
.brand{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.wordmark{display:flex;align-items:center;gap:7px;font-weight:900;font-size:1.02rem;letter-spacing:-.02em}
.wordmark svg{width:20px;height:20px}
.text-btn{color:var(--brand);font-weight:700;padding:8px 2px}
h1{font-size:2.15rem;font-weight:900;letter-spacing:-.045em;line-height:1.1;margin:22px 0 4px}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 18px;font-variant-numeric:tabular-nums}

.songs{list-style:none;margin:0 -8px;padding:0}
.song{display:flex;align-items:center;gap:14px;padding:9px 8px;border-radius:16px;min-height:74px}
.song:active{background:var(--press)}
.art{flex:none;width:56px;height:56px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:1.35rem;
  box-shadow:0 6px 16px -8px var(--shade,#000)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:700;font-size:1.02rem;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{display:block;color:var(--muted);font-size:.86rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur{flex:none;color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.chip{flex:none;font-size:.68rem;font-weight:700;color:var(--muted);background:var(--raise);border:1px solid var(--hair);border-radius:999px;padding:2px 8px}
.del{flex:none;width:30px;height:30px;border-radius:50%;background:var(--danger);display:grid;place-items:center}
.del::before{content:"";width:12px;height:2.5px;border-radius:2px;background:#fff}
.note{color:var(--muted);font-size:.84rem;line-height:1.6;margin:18px 0 0;padding:14px 16px;background:var(--raise);border-radius:16px}
.note:empty{display:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:64px 12px 0;color:var(--muted);font-size:.9rem;line-height:1.6}
.empty svg{width:52px;height:52px;color:var(--hair);margin-bottom:6px}
.empty b{color:var(--ink);font-size:1.1rem;font-weight:700}
.note.err{color:var(--danger)}
.soon{display:grid;place-items:center;min-height:55vh;color:var(--muted);text-align:center}

.fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;
  display:flex;align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:999px;background:var(--brand);color:var(--on-brand);
  font-weight:900;box-shadow:0 12px 28px -10px var(--brand)}
.fab svg{width:20px;height:20px}
.fab:active{transform:scale(.97)}
.fab{cursor:pointer;user-select:none;-webkit-user-select:none}
.fab:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr-file{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}

.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;
  width:min(360px,calc(100% - 2*max(20px,env(safe-area-inset-left,0px))));display:flex;padding:6px;border-radius:999px;
  background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid var(--hair);box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:999px;color:var(--muted);font-size:.68rem;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--ink);background:var(--press)}
.tab[aria-selected="true"] svg{color:var(--brand)}
.tab:disabled{opacity:.4;cursor:default}
@media (prefers-reduced-motion:no-preference){.song{transition:background .15s}.fab{transition:transform .12s}}
</style>

<main class="gutter" id="main">
  <div class="brand">
    <div class="wordmark">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.5h18l1.2-10.2-5.5 4.3L12 4.5 7.3 11.6 1.8 7.3z" fill="var(--brand)"/><rect x="3" y="18.8" width="18" height="2.4" rx="1.2" fill="var(--brand)"/></svg>
      화음왕
    </div>
    <button class="text-btn" id="editBtn" type="button" aria-pressed="false" hidden>편집</button>
  </div>

  <section id="screen-library">
    <h1>내 음악창고</h1>
    <p class="sub" id="count">아직 넣은 곡이 없습니다</p>
    <div class="empty" id="empty">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.2v10.1a3.2 3.2 0 1 0 1.8 2.9V8.3l7-1.6v6a3.2 3.2 0 1 0 1.8 2.9V3.4a.9.9 0 0 0-1.1-.9l-8.8 2a.9.9 0 0 0-.7.9z"/></svg>
      <b>창고가 비어 있어요</b>
      <span>아래 ‘곡 추가’를 눌러 휴대폰에 있는 mp3 파일을 고르세요.<br>파일은 이 기기 안에만 저장됩니다.</span>
    </div>
    <ul class="songs" id="songs"></ul>
    <p class="note" id="note"></p>
  </section>
  <section id="screen-soon" class="soon" hidden><p>이 탭은 아직 만들지 않았습니다.</p></section>
</main>

<!-- The button is a label for the file input itself: tapping it opens the phone's file picker directly,
     which works in browsers and in-app views that ignore a scripted click on a hidden input. -->
<label class="fab" id="addBtn" for="picker" role="button" tabindex="0">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  곡 추가
</label>
<input id="picker" class="sr-file" type="file" accept=".mp3,audio/mpeg,audio/mp3" multiple tabindex="-1" aria-hidden="true">

<nav class="tabs" role="tablist" aria-label="화면 전환">
  <button class="tab" role="tab" aria-selected="true" data-screen="library" type="button">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.2v10.1a3.2 3.2 0 1 0 1.8 2.9V8.3l7-1.6v6a3.2 3.2 0 1 0 1.8 2.9V3.4a.9.9 0 0 0-1.1-.9l-8.8 2a.9.9 0 0 0-.7.9z"/></svg>
    내 음악창고
  </button>
  <button class="tab" role="tab" aria-selected="false" disabled type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2.5 3.4"/></svg>
    준비 중
  </button>
  <button class="tab" role="tab" aria-selected="false" disabled type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2.5 3.4"/></svg>
    준비 중
  </button>
</nav>

<script>
"use strict";
const $=id=>document.getElementById(id);
let songs=[], editing=false;

// ---------------------------------------------------------------- storage (this device only)
const DB=new Promise(res=>{ try{ const r=indexedDB.open("hwaeumwang",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("songs",{keyPath:"id"});
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null) }catch(e){res(null)} });
async function dbAll(){ const db=await DB; if(!db) return [];
  return new Promise(res=>{ try{ const q=db.transaction("songs").objectStore("songs").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]) }catch(e){res([])} }) }
async function dbPut(s){ const db=await DB; if(!db) return false;
  return new Promise(res=>{ try{ const tx=db.transaction("songs","readwrite"); tx.objectStore("songs").put(s); tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false) }catch(e){res(false)} }) }
async function dbDel(id){ const db=await DB; if(db) try{ db.transaction("songs","readwrite").objectStore("songs").delete(id) }catch(e){} }

// ---------------------------------------------------------------- reading a music file
function decodeText(bytes,enc){
  if(enc===1){ if(bytes[0]===0xfe&&bytes[1]===0xff) return new TextDecoder("utf-16be").decode(bytes.subarray(2));
    return new TextDecoder("utf-16le").decode(bytes[0]===0xff&&bytes[1]===0xfe?bytes.subarray(2):bytes) }
  if(enc===2) return new TextDecoder("utf-16be").decode(bytes);
  if(enc===3) return new TextDecoder("utf-8").decode(bytes);
  try{ return new TextDecoder("euc-kr",{fatal:true}).decode(bytes) }catch(e){ return new TextDecoder("latin1").decode(bytes) }
}
async function readTags(file){                       // ID3v2 title / artist / album (mp3); other formats fall back to the file name
  const out={};
  try{
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33) return out;
    const ver=head[3], size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
    const b=new Uint8Array(await file.slice(10,10+Math.min(size,400000)).arrayBuffer()); let p=0;
    const idLen=ver===2?3:4, hdr=ver===2?6:10, want={TIT2:"title",TT2:"title",TPE1:"artist",TP1:"artist",TALB:"album",TAL:"album"};
    while(p+hdr<=b.length&&b[p]!==0){
      const id=String.fromCharCode(...b.subarray(p,p+idLen)); let len;
      if(ver===2) len=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];
      else if(ver===4) len=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];
      else len=((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;
      if(len<=0) break;
      if(want[id]&&p+hdr+len<=b.length){ const body=b.subarray(p+hdr,p+hdr+len); out[want[id]]=decodeText(body.subarray(1),body[0]).replace(/\0+$/,"").trim() }
      p+=hdr+len;
    }
  }catch(e){}
  return out;
}
function readDuration(file){
  return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; try{URL.revokeObjectURL(a.src)}catch(e){} res(v) } };
    const a=new Audio(); a.preload="metadata"; a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0); a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),4000); try{ a.src=URL.createObjectURL(file) }catch(e){ fin(0) } });
}
async function addFiles(files){
  const note=$("note"); note.className="note"; let added=0, skipped=0, unsaved=0, wrong=0;
  for(const f of files){
    if(songs.some(s=>s.name===f.name&&s.size===f.size)){ skipped++; continue }
    note.textContent=`읽는 중: ${f.name}`;
    if(!/\.mp3$/i.test(f.name)&&!/mpeg|mp3/i.test(f.type||"")){ wrong++; continue }
    const [tag,dur]=await Promise.all([readTags(f),readDuration(f)]);
    const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name,size:f.size,added:Date.now(),
      title:tag.title||f.name.replace(/\.[^.]+$/,""),artist:tag.artist||"",album:tag.album||"",dur,blob:f};
    songs.push(s); added++; render();
    if(!(await dbPut(s))) unsaved++;
  }
  const parts=[]; if(skipped) parts.push(`이미 있는 ${skipped}곡은 건너뛰었습니다.`);
  if(wrong) parts.push(`mp3가 아닌 파일 ${wrong}개는 넣지 않았습니다.`);
  if(unsaved){ parts.push(`${unsaved}곡은 이 기기에 저장하지 못해 페이지를 닫으면 사라집니다.`); note.className="note err" }
  note.textContent=parts.join(" ");
}

// ---------------------------------------------------------------- rendering
const fmt=t=>t>0?Math.floor(t/60)+":"+String(Math.round(t%60)).padStart(2,"0"):"–";
function artwork(title){                               // a stable colour pair per song, standing in for album art
  let h=7; for(const ch of title) h=(h*31+ch.codePointAt(0))%360;
  return {bg:`linear-gradient(140deg,hsl(${h} 78% 58%),hsl(${(h+48)%360} 72% 40%))`,shade:`hsl(${(h+48)%360} 72% 30%)`};
}
function render(){
  const list=songs.slice().sort((a,b)=>a.added-b.added), ul=$("songs"); ul.textContent="";
  $("empty").hidden=songs.length>0;
  for(const s of list){
    const li=document.createElement("li"); li.className="song";
    const art=document.createElement("div"); art.className="art"; art.textContent=(s.title||"?").trim().charAt(0); art.setAttribute("aria-hidden","true");
    const c=artwork(s.title||"?"); art.style.background=c.bg; art.style.setProperty("--shade",c.shade);
    const meta=document.createElement("div"); meta.className="meta";
    const b=document.createElement("b"); b.textContent=s.title;
    const sp=document.createElement("span"); sp.textContent=[s.artist||"가수 정보 없음",s.album].filter(Boolean).join(" · ");
    meta.append(b,sp); li.append(art,meta);
    if(editing){ const x=document.createElement("button"); x.className="del"; x.type="button"; x.setAttribute("aria-label",s.title+" 삭제");
      x.onclick=async()=>{ songs=songs.filter(o=>o!==s); await dbDel(s.id); if(!songs.length) setEditing(false); render() }; li.append(x) }
    else { const d=document.createElement("span"); d.className="dur"; d.textContent=fmt(s.dur); li.append(d) }
    ul.append(li);
  }
  const total=songs.reduce((a,s)=>a+(s.dur||0),0);
  $("count").textContent=songs.length?`${songs.length}곡 · ${Math.floor(total/60)}분`:"아직 넣은 곡이 없습니다";
  $("editBtn").hidden=!songs.length;
}
function setEditing(v){ editing=v; $("editBtn").setAttribute("aria-pressed",v); $("editBtn").textContent=v?"완료":"편집" }

// ---------------------------------------------------------------- wiring
$("addBtn").onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); $("picker").click() } };
$("picker").onchange=async e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length){ $("note").textContent=""; await addFiles(fs) } };
$("editBtn").onclick=()=>{ setEditing(!editing); render() };
for(const t of document.querySelectorAll(".tab")) t.onclick=()=>{
  if(t.disabled) return;
  for(const o of document.querySelectorAll(".tab")) o.setAttribute("aria-selected",o===t);
  $("screen-library").hidden=t.dataset.screen!=="library"; $("screen-soon").hidden=t.dataset.screen==="library"; $("addBtn").hidden=t.dataset.screen!=="library";
};
render();
dbAll().then(rows=>{ if(rows.length){ songs=rows; $("note").textContent=""; render() } });
</script>
