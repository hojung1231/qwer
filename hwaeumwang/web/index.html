<title>화음왕</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: a phone app shell — title bar on top, one scrolling screen per tab, tab bar pinned to the bottom. */
:root{
  --bg:#f5f3fb; --panel:#ffffff; --ink:#191431; --muted:#6d6889; --line:#e2deef;
  --accent:#5a3fd4; --accent-ink:#ffffff; --crown:#e9a81c; --tile:#ece8fa; --danger:#c8372d;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --text:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#100d1c; --panel:#1a1630; --ink:#f1eefb; --muted:#a29dbd; --line:#2c2647;
  --accent:#9a84ff; --accent-ink:#140f2b; --crown:#f6c244; --tile:#261f45; --danger:#ff7a6e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#100d1c; --panel:#1a1630; --ink:#f1eefb; --muted:#a29dbd; --line:#2c2647;
  --accent:#9a84ff; --accent-ink:#140f2b; --crown:#f6c244; --tile:#261f45; --danger:#ff7a6e; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--text);display:flex;flex-direction:column}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.appbar{display:flex;align-items:center;gap:10px;padding-block:14px 10px}
.appbar h1{font:400 1.75rem/1 var(--display);margin:0;letter-spacing:.01em}
.appbar svg{width:26px;height:26px;flex:none}

main{flex:1;min-height:0;overflow-y:auto;padding-block:4px 16px}
.screen-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:6px 12px}
.screen-head h2{font-size:1.15rem;font-weight:700;margin:0}
.screen-head p{margin:2px 0 0;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-weight:500;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}

.songs{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.song{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:64px}
.song + .song{border-top:1px solid var(--line)}
.tile{flex:none;width:42px;height:42px;border-radius:10px;background:var(--tile);color:var(--accent);display:grid;place-items:center;font:400 1.15rem/1 var(--display)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta span{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur{flex:none;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.tag{flex:none;font-size:.7rem;font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.del{flex:none;border:0;background:none;color:var(--danger);font-weight:700;padding:8px 4px}
.note{color:var(--muted);font-size:.85rem;margin:12px 4px 0}
.note.err{color:var(--danger)}
.soon{display:grid;place-items:center;min-height:50vh;color:var(--muted);text-align:center}

.tabs{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}
.tab:disabled{opacity:.45;cursor:default}
@media (prefers-reduced-motion:no-preference){.song{transition:background .15s}}
</style>

<header class="appbar gutter">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18l1.2-10-5.4 4.2L12 5 7.2 12.2 1.8 8z" fill="var(--crown)"/><rect x="3" y="19.2" width="18" height="2.2" rx="1" fill="var(--crown)"/></svg>
  <h1>화음왕</h1>
</header>

<main class="gutter" id="main">
  <section id="screen-library">
    <div class="screen-head">
      <div><h2>내 음악창고</h2><p id="count">곡 0개</p></div>
      <div class="actions">
        <button class="btn" id="editBtn" type="button" aria-pressed="false">편집</button>
        <button class="btn primary" id="addBtn" type="button">곡 추가</button>
      </div>
    </div>
    <ul class="songs" id="songs"></ul>
    <p class="note" id="note"></p>
    <input id="picker" type="file" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg" multiple hidden>
  </section>
  <section id="screen-soon" class="soon" hidden><p>이 탭은 아직 만들지 않았습니다.</p></section>
</main>

<nav class="tabs" role="tablist" aria-label="화면 전환">
  <button class="tab" role="tab" aria-selected="true" data-screen="library" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5 12 4l8 5.5V19a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M10.5 16.5V11l4-1v5.5"/><circle cx="9.3" cy="16.5" r="1.3"/><circle cx="13.3" cy="15.5" r="1.3"/></svg>
    내 음악창고
  </button>
  <button class="tab" role="tab" aria-selected="false" disabled type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3.3"/></svg>
    준비 중
  </button>
  <button class="tab" role="tab" aria-selected="false" disabled type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3.3"/></svg>
    준비 중
  </button>
</nav>

<script>
"use strict";
const $=id=>document.getElementById(id);
// Shown until the first real file is added, so the list is never an empty shell.
const EXAMPLES=[
  {id:"ex1",title:"사랑했지만",artist:"김광석",dur:268,ext:"MP3",example:true},
  {id:"ex2",title:"숙녀에게",artist:"변진섭",dur:226,ext:"MP3",example:true},
  {id:"ex3",title:"청혼",artist:"노을",dur:267,ext:"MP3",example:true},
];
let songs=[], editing=false;

// ---------------------------------------------------------------- storage (this device only)
const DB=new Promise(res=>{ try{ const r=indexedDB.open("hwaeumwang",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("songs",{keyPath:"id"});
  r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null) }catch(e){res(null)} });
async function dbAll(){ const db=await DB; if(!db) return [];
  return new Promise(res=>{ try{ const q=db.transaction("songs").objectStore("songs").getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>res([]) }catch(e){res([])} }) }
async function dbPut(s){ const db=await DB; if(!db) return false;
  return new Promise(res=>{ try{ const tx=db.transaction("songs","readwrite"); tx.objectStore("songs").put(s); tx.oncomplete=()=>res(true); tx.onerror=tx.onabort=()=>res(false) }catch(e){res(false)} }) }
async function dbDel(id){ const db=await DB; if(db) try{ db.transaction("songs","readwrite").objectStore("songs").delete(id) }catch(e){} }

// ---------------------------------------------------------------- reading a music file
function decodeText(bytes,enc){
  if(enc===1){ if(bytes[0]===0xfe&&bytes[1]===0xff) return new TextDecoder("utf-16be").decode(bytes.subarray(2));
    return new TextDecoder("utf-16le").decode(bytes[0]===0xff&&bytes[1]===0xfe?bytes.subarray(2):bytes) }
  if(enc===2) return new TextDecoder("utf-16be").decode(bytes);
  if(enc===3) return new TextDecoder("utf-8").decode(bytes);
  try{ return new TextDecoder("euc-kr",{fatal:true}).decode(bytes) }catch(e){ return new TextDecoder("latin1").decode(bytes) }
}
async function readTags(file){                       // ID3v2 title / artist / album (mp3); other formats fall back to the file name
  const out={};
  try{
    const head=new Uint8Array(await file.slice(0,10).arrayBuffer());
    if(head[0]!==0x49||head[1]!==0x44||head[2]!==0x33) return out;
    const ver=head[3], size=(head[6]<<21)|(head[7]<<14)|(head[8]<<7)|head[9];
    const b=new Uint8Array(await file.slice(10,10+Math.min(size,400000)).arrayBuffer()); let p=0;
    const idLen=ver===2?3:4, hdr=ver===2?6:10, want={TIT2:"title",TT2:"title",TPE1:"artist",TP1:"artist",TALB:"album",TAL:"album"};
    while(p+hdr<=b.length&&b[p]!==0){
      const id=String.fromCharCode(...b.subarray(p,p+idLen)); let len;
      if(ver===2) len=(b[p+3]<<16)|(b[p+4]<<8)|b[p+5];
      else if(ver===4) len=(b[p+4]<<21)|(b[p+5]<<14)|(b[p+6]<<7)|b[p+7];
      else len=((b[p+4]<<24)|(b[p+5]<<16)|(b[p+6]<<8)|b[p+7])>>>0;
      if(len<=0) break;
      if(want[id]&&p+hdr+len<=b.length){ const body=b.subarray(p+hdr,p+hdr+len); out[want[id]]=decodeText(body.subarray(1),body[0]).replace(/\0+$/,"").trim() }
      p+=hdr+len;
    }
  }catch(e){}
  return out;
}
function readDuration(file){
  return new Promise(res=>{ let done=false; const fin=v=>{ if(!done){ done=true; try{URL.revokeObjectURL(a.src)}catch(e){} res(v) } };
    const a=new Audio(); a.preload="metadata"; a.onloadedmetadata=()=>fin(isFinite(a.duration)?a.duration:0); a.onerror=()=>fin(0);
    setTimeout(()=>fin(0),4000); try{ a.src=URL.createObjectURL(file) }catch(e){ fin(0) } });
}
async function addFiles(files){
  const note=$("note"); note.className="note"; let added=0, skipped=0, unsaved=0;
  for(const f of files){
    if(songs.some(s=>s.name===f.name&&s.size===f.size)){ skipped++; continue }
    note.textContent=`읽는 중: ${f.name}`;
    const [tag,dur]=await Promise.all([readTags(f),readDuration(f)]);
    const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:f.name,size:f.size,added:Date.now(),
      title:tag.title||f.name.replace(/\.[^.]+$/,""),artist:tag.artist||"",album:tag.album||"",dur,
      ext:(f.name.split(".").pop()||"").toUpperCase().slice(0,4),blob:f};
    songs.push(s); added++; render();
    if(!(await dbPut(s))) unsaved++;
  }
  const parts=[]; if(added) parts.push(`${added}곡을 창고에 넣었습니다.`); if(skipped) parts.push(`이미 있는 ${skipped}곡은 건너뛰었습니다.`);
  if(unsaved){ parts.push(`${unsaved}곡은 이 기기에 저장하지 못해 페이지를 닫으면 사라집니다.`); note.className="note err" }
  note.textContent=parts.join(" ");
}

// ---------------------------------------------------------------- rendering
const fmt=t=>t>0?Math.floor(t/60)+":"+String(Math.round(t%60)).padStart(2,"0"):"–";
function render(){
  const list=songs.length?songs.slice().sort((a,b)=>a.added-b.added):EXAMPLES, ul=$("songs"); ul.textContent="";
  for(const s of list){
    const li=document.createElement("li"); li.className="song";
    const tile=document.createElement("div"); tile.className="tile"; tile.textContent=(s.title||"?").trim().charAt(0); tile.setAttribute("aria-hidden","true");
    const meta=document.createElement("div"); meta.className="meta";
    const b=document.createElement("b"); b.textContent=s.title;
    const sp=document.createElement("span"); sp.textContent=[s.artist||"가수 정보 없음",s.album].filter(Boolean).join(" · ");
    meta.append(b,sp); li.append(tile,meta);
    if(s.example){ const t=document.createElement("span"); t.className="tag"; t.textContent="예시"; li.append(t) }
    const d=document.createElement("span"); d.className="dur"; d.textContent=fmt(s.dur); li.append(d);
    if(editing&&!s.example){ const x=document.createElement("button"); x.className="del"; x.type="button"; x.textContent="삭제"; x.setAttribute("aria-label",s.title+" 삭제");
      x.onclick=async()=>{ songs=songs.filter(o=>o!==s); await dbDel(s.id); if(!songs.length) setEditing(false); render() }; li.append(x) }
    ul.append(li);
  }
  const total=songs.reduce((a,s)=>a+(s.dur||0),0);
  $("count").textContent=songs.length?`곡 ${songs.length}개 · 전체 ${Math.floor(total/60)}분`:"아직 넣은 곡이 없습니다";
  $("editBtn").hidden=!songs.length;
  if(!songs.length&&!$("note").textContent) $("note").textContent="위 세 곡은 화면 예시입니다. ‘곡 추가’로 휴대폰의 음악 파일을 고르면 그 곡들로 바뀝니다. 파일은 이 기기 안에만 저장됩니다.";
}
function setEditing(v){ editing=v; $("editBtn").setAttribute("aria-pressed",v); $("editBtn").textContent=v?"완료":"편집" }

// ---------------------------------------------------------------- wiring
$("addBtn").onclick=()=>$("picker").click();
$("picker").onchange=async e=>{ const fs=[...e.target.files]; e.target.value=""; if(fs.length){ $("note").textContent=""; await addFiles(fs) } };
$("editBtn").onclick=()=>{ setEditing(!editing); render() };
for(const t of document.querySelectorAll(".tab")) t.onclick=()=>{
  if(t.disabled) return;
  for(const o of document.querySelectorAll(".tab")) o.setAttribute("aria-selected",o===t);
  $("screen-library").hidden=t.dataset.screen!=="library"; $("screen-soon").hidden=t.dataset.screen==="library";
};
render();
dbAll().then(rows=>{ if(rows.length){ songs=rows; $("note").textContent=""; render() } });
</script>
